# Self-hosting: docker compose pull && docker compose up -d
# Development:  docker compose up --build
services:
  app:
    image: ${IMAGE:-eacer/docuscrypt:latest}
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-8080}:8080"
    # The image's HEALTHCHECK already runs (`/docuscrypt healthcheck` -> /healthz).
    # Uncomment to change its timings, or use `disable: true` to turn it off.
    # healthcheck:
    #   test: ["CMD", "/docuscrypt", "healthcheck"]
    #   interval: 30s
    #   timeout: 3s
    #   start_period: 5s
    #   retries: 3
